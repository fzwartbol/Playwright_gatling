apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gatling-run
spec:
  description: >
    Runs a Gatling load test against the real application.

    Traffic flow during load test:
      Gatling → real app → WireMock (replay stubs) → [no live downstream services needed]

    Gatling measures the throughput and latency of the REAL application.
    The application's outbound calls to downstream services are served by
    WireMock stubs recorded in the previous wiremock-record task, so the
    downstream systems are never hit under load.

    The WireMock Kubernetes Service must still be running (it was deployed by
    deploy-wiremock and remains up throughout the pipeline).
  params:
    - name: app-url
      type: string
      description: >
        URL of the real application under load test.
        E.g. http://myapp.loadtest.svc.cluster.local:8080
        Gatling sends all load to this URL.
    - name: gatling-users
      type: string
      default: "10"
    - name: gatling-duration
      type: string
      default: "60"
      description: Ramp duration in seconds
    - name: simulation-class
      type: string
      default: "simulations.GwtJourneySimulation"
  workspaces:
    - name: source
      description: Shared workspace with gatling/ directory
  results:
    - name: report-path
      description: Path to the Gatling HTML report on the workspace
    - name: success-pct
      description: Global successful-request percentage
  steps:
    - name: run-gatling
      image: maven:3.9.6-eclipse-temurin-11
      workingDir: $(workspaces.source.path)/gatling
      env:
        # Points Gatling at the REAL application, not WireMock.
        - name: BASE_URL
          value: "$(params.app-url)"
        - name: GATLING_USERS
          value: "$(params.gatling-users)"
        - name: GATLING_DURATION
          value: "$(params.gatling-duration)"
        - name: MAVEN_OPTS
          value: "-Xmx1g"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "Load testing: $BASE_URL"
        echo "Users: $GATLING_USERS over ${GATLING_DURATION}s"
        mvn -B gatling:test -Dgatling.simulationClass=$(params.simulation-class)

    - name: archive-report
      image: alpine:3.19
      workingDir: $(workspaces.source.path)/gatling
      script: |
        #!/usr/bin/env sh
        set -eu
        REPORT_DIR=$(ls -td target/gatling/*/ 2>/dev/null | head -1)
        [ -z "$REPORT_DIR" ] && echo "No Gatling report found" && exit 1

        printf '%s' "$(workspaces.source.path)/gatling/$REPORT_DIR" > $(results.report-path.path)

        LOG="$REPORT_DIR/simulation.log"
        if [ -f "$LOG" ]; then
          OK=$(awk -F'\t' '$1=="REQUEST" && $6=="OK" {ok++} END{print ok+0}' "$LOG")
          TOT=$(awk -F'\t' '$1=="REQUEST" {tot++} END{print tot+0}' "$LOG")
          PCT=$(( TOT > 0 ? OK * 100 / TOT : 0 ))
          printf '%s' "$PCT" > $(results.success-pct.path)
          echo "Result: $OK/$TOT requests OK ($PCT%)"
        else
          printf '0' > $(results.success-pct.path)
        fi
