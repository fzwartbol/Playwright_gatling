apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gatling-wiremock-run
spec:
  description: >
    Starts WireMock in replay mode (stubs from the shared workspace PVC),
    runs Gatling against it, and archives the HTML report.
    The real application does not need to be running during this task.
  params:
    - name: gatling-users
      type: string
      default: "5"
    - name: gatling-duration
      type: string
      default: "30"
      description: Ramp duration in seconds
    - name: simulation-class
      type: string
      default: "simulations.GwtJourneySimulation"
  workspaces:
    - name: source
  results:
    - name: report-path
      description: Path to the Gatling HTML report on the workspace
    - name: success-pct
      description: Global successful-request percentage
  sidecars:
    - name: wiremock
      image: wiremock/wiremock:3.5.4-alpine
      args:
        - "--port=8080"
        - "--root-dir=/workspace/source/wiremock"
        - "--global-response-templating"
        - "--verbose"
      readinessProbe:
        httpGet:
          path: /__admin/health
          port: 8080
        initialDelaySeconds: 3
        periodSeconds: 2
        failureThreshold: 20
  steps:
    - name: wait-for-wiremock
      image: alpine/curl:8.7.1
      script: |
        #!/usr/bin/env sh
        set -eu
        until curl -sf http://localhost:8080/__admin/health > /dev/null; do sleep 2; done
        echo "WireMock ready. Loaded stubs:"
        curl -s http://localhost:8080/__admin/mappings | grep -o '"total":[0-9]*' || true

    - name: run-gatling
      image: maven:3.9.6-eclipse-temurin-11
      workingDir: $(workspaces.source.path)/gatling
      env:
        - name: BASE_URL
          value: "http://localhost:8080"
        - name: GATLING_USERS
          value: "$(params.gatling-users)"
        - name: GATLING_DURATION
          value: "$(params.gatling-duration)"
        - name: MAVEN_OPTS
          value: "-Xmx1g"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mvn -B gatling:test -Dgatling.simulationClass=$(params.simulation-class)

    - name: archive-report
      image: alpine:3.19
      workingDir: $(workspaces.source.path)/gatling
      script: |
        #!/usr/bin/env sh
        set -eu
        REPORT_DIR=$(ls -td target/gatling/*/ 2>/dev/null | head -1)
        [ -z "$REPORT_DIR" ] && echo "No Gatling report found" && exit 1
        printf '%s' "$(workspaces.source.path)/gatling/$REPORT_DIR" > $(results.report-path.path)
        LOG="$REPORT_DIR/simulation.log"
        if [ -f "$LOG" ]; then
          OK=$(grep -oP 'OK \K[0-9]+(?= \()' "$LOG" | tail -1 || echo 0)
          TOT=$(grep -oP 'total \K[0-9]+' "$LOG" | tail -1 || echo 0)
          PCT=$(( TOT > 0 ? OK * 100 / TOT : 0 ))
          printf '%s' "$PCT" > $(results.success-pct.path)
          echo "Result: $OK/$TOT requests OK ($PCT%)"
        else
          printf '0' > $(results.success-pct.path)
        fi
