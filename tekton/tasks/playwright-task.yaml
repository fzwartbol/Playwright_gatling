apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: playwright-record-har
spec:
  description: >
    Runs Playwright (Java) tests against BASE_URL and records HAR files to the shared workspace.
  params:
    - name: base-url
      type: string
      description: Application URL under test
    - name: test-filter
      type: string
      description: Surefire -Dtest filter passed to `mvn test` (empty = all tests)
      default: ""
  workspaces:
    - name: source
      description: Shared workspace; repo is expected at $(workspaces.source.path)
  results:
    - name: har-dir
      description: Path to the directory containing recorded HAR files
  steps:
    - name: record
      # Official Playwright-for-Java image with browsers + OS deps preinstalled
      image: mcr.microsoft.com/playwright/java:v1.44.0-jammy
      workingDir: $(workspaces.source.path)/playwright
      env:
        - name: BASE_URL
          value: $(params.base-url)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p $(workspaces.source.path)/har
        TEST_ARG=""
        if [ -n "$(params.test-filter)" ]; then
          TEST_ARG="-Dtest=$(params.test-filter)"
        fi
        mvn -B test $TEST_ARG
        echo -n "$(workspaces.source.path)/har" > $(results.har-dir.path)
