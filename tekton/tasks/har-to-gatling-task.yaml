apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: har-to-gatling
spec:
  description: >
    Converts HAR files in the workspace into Gatling Scala simulations.
  params:
    - name: base-url
      type: string
      description: Application base URL (used in generated simulation)
    - name: har-dir
      type: string
      description: Path to HAR files (passed from playwright-record-har result)
      default: ""
  workspaces:
    - name: source
  results:
    - name: simulations-dir
      description: Path to generated Java simulation files
  steps:
    - name: convert
      image: node:20-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: BASE_URL
          value: $(params.base-url)
        - name: HAR_DIR
          value: $(params.har-dir)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        HAR_DIR="${HAR_DIR:-$(workspaces.source.path)/har}"
        OUT_DIR="$(workspaces.source.path)/gatling/src/test/java/simulations"
        mkdir -p "$OUT_DIR"

        for har_file in "$HAR_DIR"/*.har; do
          [ -f "$har_file" ] || { echo "No HAR files found in $HAR_DIR"; exit 1; }
          base=$(basename "$har_file" .har)
          # Convert snake_case / kebab-case filename to PascalCase class name
          class=$(echo "$base" | sed -E 's/(^|[-_])([a-z])/\U\2/g')Simulation
          echo "Converting $har_file -> ${class}"
          node scripts/har-to-gatling.js \
            --har "$har_file" \
            --simulation "$class" \
            --base-url "$BASE_URL" \
            --out "$OUT_DIR/${class}.java"
        done

        echo -n "$OUT_DIR" > $(results.simulations-dir.path)
