apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wiremock-record
spec:
  description: >
    Drives Playwright against the real application while WireMock proxies and
    records every outbound call the app makes to downstream services.

    Traffic flow during recording:
      Playwright → real app → WireMock (proxy) → real downstream services

    Two things are captured:
      1. WireMock stub files  — recorded to wiremock/mappings/ on the PVC.
         The gatling-run task replays these under load so downstream services
         are never hit during the load test.
      2. Playwright HAR file  — written to har/<name>.har on the PVC.
         The generate-simulation task converts this into a Gatling Java
         simulation that drives the real application.

    Prerequisites:
      - The app overlay must route outbound downstream calls to WireMock:
          DOWNSTREAM_SERVICE_URL: http://wiremock.<namespace>.svc.cluster.local:8080
      - deploy-wiremock and deploy-app must have run first.
  params:
    - name: wiremock-url
      type: string
      description: >
        Base URL of the WireMock Kubernetes Service.
        E.g. http://wiremock.loadtest.svc.cluster.local:8080
    - name: app-url
      type: string
      description: >
        URL of the real application. Playwright drives this directly.
        WireMock is not in front of the app — it intercepts the app's
        outbound downstream calls (configured via the app overlay).
        E.g. http://myapp.loadtest.svc.cluster.local:8080
    - name: downstream-base-url
      type: string
      description: >
        URL of the real downstream service WireMock proxies to during recording.
        E.g. https://api.payments.example.com or http://user-svc.prod:8080
    - name: test-filter
      type: string
      default: ""
      description: Maven Surefire -Dtest filter (empty = all tests)
  workspaces:
    - name: source
      description: Shared workspace with playwright/, har/, wiremock/ directories
  results:
    - name: stub-count
      description: Number of WireMock stubs recorded
    - name: har-name
      description: Base name of the HAR file written to har/ (without .har)
  steps:
    - name: start-recording
      image: alpine/curl:8.7.1
      script: |
        #!/usr/bin/env sh
        set -eu
        WM="$(params.wiremock-url)"
        DS="$(params.downstream-base-url)"

        echo "Starting WireMock recording"
        echo "  WireMock admin : $WM"
        echo "  Proxying to    : $DS"

        # Stubs match on URL+method only (no header matchers) so the Gatling
        # simulation can send any valid auth token and WireMock will respond.
        curl -sf -X POST "$WM/__admin/recordings/start" \
          -H 'Content-Type: application/json' \
          -d "{
            \"targetBaseUrl\": \"$DS\",
            \"persist\": true,
            \"repeatsAsScenarios\": false
          }"
        echo "Recording started."

    - name: run-playwright
      image: mcr.microsoft.com/playwright/java:v1.44.0-jammy
      workingDir: $(workspaces.source.path)/playwright
      env:
        # Playwright drives the REAL application directly.
        # The app's outbound downstream calls are routed to WireMock
        # via the overlay env var DOWNSTREAM_SERVICE_URL.
        - name: BASE_URL
          value: "$(params.app-url)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p "$(workspaces.source.path)/har"
        TEST_ARG=""
        [ -n "$(params.test-filter)" ] && TEST_ARG="-Dtest=$(params.test-filter)"
        mvn -B test $TEST_ARG

    - name: stop-recording
      image: alpine/curl:8.7.1
      script: |
        #!/usr/bin/env sh
        set -eu
        WM="$(params.wiremock-url)"

        echo "Stopping WireMock recording..."
        curl -sf -X POST "$WM/__admin/recordings/stop"

        TOTAL=$(curl -s "$WM/__admin/mappings" \
          | grep -o '"total":[0-9]*' | grep -o '[0-9]*')
        echo "Total stubs recorded: $TOTAL"
        ls $(workspaces.source.path)/wiremock/mappings/
        printf '%s' "$TOTAL" > $(results.stub-count.path)

    - name: emit-har-name
      image: alpine:3.19
      script: |
        #!/usr/bin/env sh
        set -eu
        HAR=$(ls -t $(workspaces.source.path)/har/*.har 2>/dev/null | head -1)
        [ -z "$HAR" ] && echo "ERROR: No HAR file found in har/" && exit 1
        BASE=$(basename "$HAR" .har)
        echo "HAR: $HAR  (name: $BASE)"
        printf '%s' "$BASE" > $(results.har-name.path)
