apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wiremock-record
spec:
  description: >
    Drives Playwright through WireMock in recording/proxy mode so that
    every request and response in the user journey is captured as a stub.

    Traffic flow during recording:
      Playwright → WireMock (proxy+record) → real application

    After this task completes, WireMock's mappings/ directory contains a stub
    for every request Playwright made. The generate-simulation task converts the
    HAR recording into a Gatling simulation, and the gatling-run task replays
    it at scale against WireMock — no real application needed during the load test.
  params:
    - name: wiremock-url
      type: string
      description: >
        Base URL of the WireMock Kubernetes Service.
        E.g. http://wiremock.loadtest.svc.cluster.local:8080
        Playwright sends all requests here; WireMock proxies to app-url.
    - name: app-url
      type: string
      description: >
        URL of the real application that WireMock proxies to during recording.
        E.g. http://myapp.loadtest.svc.cluster.local:8080
    - name: test-filter
      type: string
      default: ""
      description: Maven Surefire -Dtest filter (empty = all Playwright tests)
  workspaces:
    - name: source
      description: Shared workspace with load-test repo (playwright/, har/, wiremock/)
  results:
    - name: stub-count
      description: Number of stubs recorded
    - name: har-name
      description: Base name of the HAR file written to har/ (without .har extension)
  steps:
    - name: start-recording
      image: alpine/curl:8.7.1
      script: |
        #!/usr/bin/env sh
        set -eu
        WM="$(params.wiremock-url)"
        APP="$(params.app-url)"

        echo "Starting WireMock recording"
        echo "  WireMock : $WM"
        echo "  Proxying : $APP"

        # No captureHeaders — stubs match on URL+method only so replay
        # is not tied to specific token values from the recording session.
        curl -sf -X POST "$WM/__admin/recordings/start" \
          -H 'Content-Type: application/json' \
          -d "{
            \"targetBaseUrl\": \"$APP\",
            \"persist\": true,
            \"repeatsAsScenarios\": false
          }"
        echo "Recording started."

    - name: run-playwright
      image: mcr.microsoft.com/playwright/java:v1.44.0-jammy
      workingDir: $(workspaces.source.path)/playwright
      env:
        # Playwright drives WireMock (which proxies every request to the real app).
        # This captures both the requests Playwright makes AND the app's responses.
        - name: BASE_URL
          value: "$(params.wiremock-url)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p "$(workspaces.source.path)/har"
        TEST_ARG=""
        [ -n "$(params.test-filter)" ] && TEST_ARG="-Dtest=$(params.test-filter)"
        mvn -B test $TEST_ARG

    - name: stop-recording
      image: alpine/curl:8.7.1
      script: |
        #!/usr/bin/env sh
        set -eu
        WM="$(params.wiremock-url)"

        echo "Stopping WireMock recording..."
        curl -sf -X POST "$WM/__admin/recordings/stop"

        TOTAL=$(curl -s "$WM/__admin/mappings" \
          | grep -o '"total":[0-9]*' | grep -o '[0-9]*')
        echo "Total stubs: $TOTAL"
        echo "Stub files:"
        ls $(workspaces.source.path)/wiremock/mappings/
        printf '%s' "$TOTAL" > $(results.stub-count.path)

    - name: emit-har-name
      image: alpine:3.19
      script: |
        #!/usr/bin/env sh
        set -eu
        # Find the most recently written HAR file and emit its base name.
        HAR=$(ls -t $(workspaces.source.path)/har/*.har 2>/dev/null | head -1)
        [ -z "$HAR" ] && echo "No HAR file found in har/" && exit 1
        BASE=$(basename "$HAR" .har)
        echo "HAR recorded: $HAR  (base: $BASE)"
        printf '%s' "$BASE" > $(results.har-name.path)
