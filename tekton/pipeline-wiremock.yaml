apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: wiremock-record-and-load-test
  labels:
    app: playwright-gatling
spec:
  description: >
    End-to-end load test pipeline. Point it at your app repo + overlay and it
    does everything automatically:
      1. Clone this repo onto the PVC
      2. Deploy WireMock as a K8s Service (proxies to your app during recording)
      3. Deploy your application
      4. Run Playwright through WireMock — every request/response is captured
      5. Auto-generate a Gatling simulation from the HAR recording
      6. Run Gatling against WireMock at the configured user load

    Traffic flows:
      Recording:  Playwright → WireMock (proxy) → real app
      Load test:  Gatling   → WireMock (replay) → [no real app needed]

  params:
    # ── Load test repo (this repo) ────────────────────────────────────────────
    - name: loadtest-repo-url
      type: string
    - name: loadtest-repo-revision
      type: string
      default: main

    # ── Application to test ───────────────────────────────────────────────────
    - name: app-repo-url
      type: string
      description: Git URL of your application repository
    - name: app-repo-revision
      type: string
      default: main
    - name: overlay-path
      type: string
      description: Path within the app repo to Kubernetes manifests
    - name: namespace
      type: string
      default: loadtest
    - name: app-service-name
      type: string
      description: Kubernetes Service name that exposes the application
    - name: app-service-port
      type: string
      default: "8080"

    # ── Playwright ────────────────────────────────────────────────────────────
    - name: test-filter
      type: string
      default: ""
      description: Maven Surefire -Dtest filter (empty = all tests)

    # ── Generated simulation ──────────────────────────────────────────────────
    - name: simulation-class-name
      type: string
      default: RecordedSimulation
      description: Java class name for the auto-generated Gatling simulation

    # ── Gatling ───────────────────────────────────────────────────────────────
    - name: gatling-users
      type: string
      default: "10"
    - name: gatling-duration
      type: string
      default: "60"

  workspaces:
    - name: shared-data
      description: >
        ReadWriteMany PVC shared by all tasks AND the WireMock Deployment pod.

  results:
    - name: wiremock-url
      value: $(tasks.deploy-wiremock.results.wiremock-url)
    - name: app-url
      value: $(tasks.deploy-app.results.app-url)
    - name: stub-count
      value: $(tasks.record.results.stub-count)
    - name: simulation-class
      value: $(tasks.generate-simulation.results.simulation-class)
    - name: report-path
      value: $(tasks.load-test.results.report-path)
    - name: success-pct
      value: $(tasks.load-test.results.success-pct)

  tasks:
    # ── 1. Clone this load-test repo ─────────────────────────────────────────
    - name: fetch-loadtest-repo
      taskRef:
        name: fetch-repo
      params:
        - name: url
          value: $(params.loadtest-repo-url)
        - name: revision
          value: $(params.loadtest-repo-revision)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 2. Deploy WireMock as K8s Service ────────────────────────────────────
    # WireMock reads pre-committed stubs from the PVC immediately on start.
    - name: deploy-wiremock
      taskRef:
        name: deploy-wiremock
      runAfter:
        - fetch-loadtest-repo
      params:
        - name: namespace
          value: $(params.namespace)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 3. Deploy the application under test ─────────────────────────────────
    # Runs in parallel with deploy-wiremock.
    # The app runs normally — no special overlay config needed because WireMock
    # sits in FRONT of the app (proxy mode), not between app and its dependencies.
    - name: deploy-app
      taskRef:
        name: deploy-app
      runAfter:
        - fetch-loadtest-repo
      params:
        - name: app-repo-url
          value: $(params.app-repo-url)
        - name: app-repo-revision
          value: $(params.app-repo-revision)
        - name: overlay-path
          value: $(params.overlay-path)
        - name: namespace
          value: $(params.namespace)
        - name: app-service-name
          value: $(params.app-service-name)
        - name: app-service-port
          value: $(params.app-service-port)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 4. Record: Playwright → WireMock → real app ───────────────────────────
    # Every request and response is captured.
    # Playwright HAR is also written to har/ on the PVC.
    - name: record
      taskRef:
        name: wiremock-record
      runAfter:
        - deploy-wiremock
        - deploy-app
      params:
        - name: wiremock-url
          value: $(tasks.deploy-wiremock.results.wiremock-url)
        - name: app-url
          value: $(tasks.deploy-app.results.app-url)
        - name: test-filter
          value: $(params.test-filter)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 5. Auto-generate Gatling simulation from the HAR ─────────────────────
    - name: generate-simulation
      taskRef:
        name: generate-simulation
      runAfter:
        - record
      params:
        - name: har-name
          value: $(tasks.record.results.har-name)
        - name: class-name
          value: $(params.simulation-class-name)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 6. Load test: Gatling → WireMock (replays stubs) ─────────────────────
    # Gatling targets WireMock — no real application needed.
    - name: load-test
      taskRef:
        name: gatling-run
      runAfter:
        - generate-simulation
      params:
        - name: app-url
          value: $(tasks.deploy-wiremock.results.wiremock-url)
        - name: gatling-users
          value: $(params.gatling-users)
        - name: gatling-duration
          value: $(params.gatling-duration)
        - name: simulation-class
          value: $(tasks.generate-simulation.results.simulation-class)
      workspaces:
        - name: source
          workspace: shared-data
