apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: wiremock-record-and-load-test
  labels:
    app: playwright-gatling
spec:
  description: >
    Fully-integrated load test pipeline. Point it at your app repo + overlay
    and it records, generates, and load-tests automatically.

    Architecture
    ────────────
    WireMock sits between your APPLICATION and its DOWNSTREAM DEPENDENCIES.
    The app overlay must route downstream calls to WireMock:
      DOWNSTREAM_SERVICE_URL: http://wiremock.<namespace>.svc.cluster.local:8080

    Recording:   Playwright → real app → WireMock (proxy) → downstream services
    Load test:   Gatling    → real app → WireMock (replay) → [stubs, no live downstream]

    Gatling measures the REAL APPLICATION'S throughput and latency.
    Downstream services are stubbed so they are never hit under load.

    Auto-generation
    ───────────────
    The Playwright HAR recording is converted into a Gatling simulation by
    scripts/har-to-simulation.js. The generator:
      - Detects login requests and parameterises credentials (#{username}/#{password})
        so every VU logs in with its own identity from feeders/users.csv.
      - Detects auth tokens in JSON responses (token, xsrfToken, etc.) and adds
        .check(jsonPath(...).saveAs(...)) so every VU holds its own live token.
      - Replaces all token values in subsequent requests with #{varName} EL
        so each VU uses its own freshly-issued token throughout the journey.
    No manual Gatling code required.

    Pipeline steps
    ──────────────
      fetch-loadtest-repo  ──┐
                             ├──► record ──► generate-simulation ──► load-test
      deploy-wiremock     ──┤
      deploy-app          ──┘

  params:
    # ── Load test repo (this repo) ────────────────────────────────────────────
    - name: loadtest-repo-url
      type: string
    - name: loadtest-repo-revision
      type: string
      default: main

    # ── Application under test ────────────────────────────────────────────────
    - name: app-repo-url
      type: string
      description: Git URL of your application repository
    - name: app-repo-revision
      type: string
      default: main
    - name: overlay-path
      type: string
      description: >
        Path to K8s manifests. The overlay MUST set DOWNSTREAM_SERVICE_URL
        to http://wiremock.<namespace>.svc.cluster.local:8080 so the app's
        outbound calls are intercepted by WireMock.
    - name: namespace
      type: string
      default: loadtest
    - name: app-service-name
      type: string
    - name: app-service-port
      type: string
      default: "8080"

    # ── Downstream service (what WireMock proxies to during recording) ────────
    - name: downstream-base-url
      type: string
      description: >
        URL of the real downstream service your app calls (payment API, user
        service, etc.). WireMock proxies to this during recording and replays
        the stubs during load test — the real downstream is never hit under load.

    # ── Playwright ────────────────────────────────────────────────────────────
    - name: test-filter
      type: string
      default: ""
      description: Maven Surefire -Dtest filter (empty = all tests)

    # ── Gatling ───────────────────────────────────────────────────────────────
    - name: gatling-users
      type: string
      default: "10"
    - name: gatling-duration
      type: string
      default: "60"

  workspaces:
    - name: shared-data
      description: ReadWriteMany PVC shared by all tasks and the WireMock pod.

  results:
    - name: wiremock-url
      value: $(tasks.deploy-wiremock.results.wiremock-url)
    - name: app-url
      value: $(tasks.deploy-app.results.app-url)
    - name: stub-count
      value: $(tasks.record.results.stub-count)
    - name: simulation-class
      value: $(tasks.generate-simulation.results.simulation-class)
    - name: report-path
      value: $(tasks.load-test.results.report-path)
    - name: success-pct
      value: $(tasks.load-test.results.success-pct)

  tasks:
    # ── 1. Clone this load-test repo onto the PVC ─────────────────────────────
    - name: fetch-loadtest-repo
      taskRef:
        name: fetch-repo
      params:
        - name: url
          value: $(params.loadtest-repo-url)
        - name: revision
          value: $(params.loadtest-repo-revision)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 2. Deploy WireMock as a persistent K8s Service ────────────────────────
    # Runs after fetch so pre-committed stubs are on the PVC before WireMock starts.
    - name: deploy-wiremock
      taskRef:
        name: deploy-wiremock
      runAfter:
        - fetch-loadtest-repo
      params:
        - name: namespace
          value: $(params.namespace)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 3. Clone app repo, apply overlay, wait for rollout ────────────────────
    # The overlay MUST configure the app to route downstream calls to WireMock:
    #   DOWNSTREAM_SERVICE_URL: http://wiremock.<namespace>.svc.cluster.local:8080
    - name: deploy-app
      taskRef:
        name: deploy-app
      runAfter:
        - fetch-loadtest-repo
      params:
        - name: app-repo-url
          value: $(params.app-repo-url)
        - name: app-repo-revision
          value: $(params.app-repo-revision)
        - name: overlay-path
          value: $(params.overlay-path)
        - name: namespace
          value: $(params.namespace)
        - name: app-service-name
          value: $(params.app-service-name)
        - name: app-service-port
          value: $(params.app-service-port)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 4. Record: Playwright → real app → WireMock → downstream ─────────────
    # WireMock stubs are written to wiremock/mappings/ on the PVC.
    # Playwright HAR is written to har/ on the PVC.
    - name: record
      taskRef:
        name: wiremock-record
      runAfter:
        - deploy-wiremock
        - deploy-app
      params:
        - name: wiremock-url
          value: $(tasks.deploy-wiremock.results.wiremock-url)
        - name: app-url
          value: $(tasks.deploy-app.results.app-url)
        - name: downstream-base-url
          value: $(params.downstream-base-url)
        - name: test-filter
          value: $(params.test-filter)
      workspaces:
        - name: source
          workspace: shared-data

    # ── 5. Auto-generate Gatling simulation from the HAR ─────────────────────
    # No manual Gatling code required. The generator handles auth tokens and
    # per-VU credential parameterisation automatically.
    - name: generate-simulation
      taskRef:
        name: generate-simulation
      runAfter:
        - record
      params:
        - name: har-name
          value: $(tasks.record.results.har-name)
        - name: class-name
          value: RecordedSimulation
      workspaces:
        - name: source
          workspace: shared-data

    # ── 6. Load test: Gatling → real app → WireMock stubs ────────────────────
    # Gatling targets the REAL APPLICATION. The app's downstream calls are
    # served by WireMock stubs — no live downstream services needed.
    - name: load-test
      taskRef:
        name: gatling-run
      runAfter:
        - generate-simulation
      params:
        - name: app-url
          value: $(tasks.deploy-app.results.app-url)
        - name: gatling-users
          value: $(params.gatling-users)
        - name: gatling-duration
          value: $(params.gatling-duration)
        - name: simulation-class
          value: $(tasks.generate-simulation.results.simulation-class)
      workspaces:
        - name: source
          workspace: shared-data
