apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: wiremock-record-and-load-test
  labels:
    app: playwright-gatling
spec:
  description: >
    End-to-end load test pipeline:
      1. deploy-app     — clones the app repo, creates the namespace, applies
                          the Kubernetes overlay, waits for the app to be ready
      2. wiremock-record — starts WireMock as a reverse proxy, runs Playwright
                           to record all traffic as stubs, persists stubs to PVC
      3. gatling-wiremock-run — replays stubs with WireMock, runs Gatling load test

    Point it at your repo and overlay path and it does the rest.
  params:
    # ── Application deployment ───────────────────────────────────────────────
    - name: app-repo-url
      type: string
      description: Git URL of the application repository
    - name: app-repo-revision
      type: string
      default: main
      description: Branch / tag / SHA to deploy
    - name: overlay-path
      type: string
      description: >
        Path within the app repo to Kubernetes manifests.
        Kustomize overlay (contains kustomization.yaml) or plain directory.
    - name: namespace
      type: string
      default: loadtest
      description: Namespace to create and deploy the app into
    - name: app-service-name
      type: string
      description: Kubernetes Service name that exposes the application
    - name: app-service-port
      type: string
      default: "8080"

    # ── Recording ────────────────────────────────────────────────────────────
    - name: test-filter
      type: string
      default: ""
      description: Maven Surefire -Dtest filter (empty = all Playwright tests)

    # ── Load test ────────────────────────────────────────────────────────────
    - name: gatling-users
      type: string
      default: "5"
    - name: gatling-duration
      type: string
      default: "30"
    - name: simulation-class
      type: string
      default: "simulations.GwtJourneySimulation"

  workspaces:
    - name: shared-data
      description: PVC shared by all tasks; load-test repo and stubs live here

  results:
    - name: app-url
      description: In-cluster URL of the deployed application
      value: $(tasks.deploy-app.results.app-url)
    - name: stub-count
      description: Number of WireMock stubs recorded
      value: $(tasks.record.results.stub-count)
    - name: report-path
      description: Path to the Gatling HTML report on the workspace
      value: $(tasks.load-test.results.report-path)
    - name: success-pct
      description: Gatling global success percentage
      value: $(tasks.load-test.results.success-pct)

  tasks:
    - name: deploy-app
      taskRef:
        name: deploy-app
      params:
        - name: app-repo-url
          value: $(params.app-repo-url)
        - name: app-repo-revision
          value: $(params.app-repo-revision)
        - name: overlay-path
          value: $(params.overlay-path)
        - name: namespace
          value: $(params.namespace)
        - name: app-service-name
          value: $(params.app-service-name)
        - name: app-service-port
          value: $(params.app-service-port)
      workspaces:
        - name: source
          workspace: shared-data

    - name: record
      taskRef:
        name: wiremock-record
      runAfter:
        - deploy-app
      params:
        - name: real-app-url
          value: $(tasks.deploy-app.results.app-url)
        - name: test-filter
          value: $(params.test-filter)
      workspaces:
        - name: source
          workspace: shared-data

    - name: load-test
      taskRef:
        name: gatling-wiremock-run
      runAfter:
        - record
      params:
        - name: gatling-users
          value: $(params.gatling-users)
        - name: gatling-duration
          value: $(params.gatling-duration)
        - name: simulation-class
          value: $(params.simulation-class)
      workspaces:
        - name: source
          workspace: shared-data
