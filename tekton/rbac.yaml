---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playwright-gatling-sa
  # Must match the namespace where PipelineRuns are created.
  # Run: kubectl get pods -A | grep tekton-pipelines-controller
  # to find the namespace, then update here and in the ClusterRoleBinding below.
  namespace: tekton-pipelines

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: playwright-gatling-deployer
rules:
  # Create / manage the target namespace
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "update", "patch"]
  # Workload types (app overlay + WireMock Deployment)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Services, config, secrets, PVCs
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts",
                "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Rollout status checks
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: playwright-gatling-deployer-binding
subjects:
  - kind: ServiceAccount
    name: playwright-gatling-sa
    namespace: tekton-pipelines  # keep in sync with ServiceAccount namespace above
roleRef:
  kind: ClusterRole
  name: playwright-gatling-deployer
  apiGroup: rbac.authorization.k8s.io
