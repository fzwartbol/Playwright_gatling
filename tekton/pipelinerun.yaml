apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: playwright-gatling-run-
spec:
  pipelineRef:
    name: playwright-gatling-pipeline
  params:
    - name: base-url
      value: "http://your-app.example.com"  # <-- set this
    - name: users
      value: "10"
    - name: duration
      value: "60"
    - name: test-filter
      value: ""
    - name: simulation-class
      value: ""
  workspaces:
    - name: shared-ws
      persistentVolumeClaim:
        claimName: playwright-gatling-ws
