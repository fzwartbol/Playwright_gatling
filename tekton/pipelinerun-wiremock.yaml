apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: wiremock-record-and-load-test-
  labels:
    app: playwright-gatling
spec:
  pipelineRef:
    name: wiremock-record-and-load-test
  taskRunTemplate:
    serviceAccountName: playwright-gatling-sa   # see tekton/rbac.yaml
  params:
    # ── This repo ─────────────────────────────────────────────────────────────
    - name: loadtest-repo-url
      value: "https://github.com/myorg/playwright-gatling"   # ← this repo
    - name: loadtest-repo-revision
      value: main

    # ── Application under test ────────────────────────────────────────────────
    - name: app-repo-url
      value: "https://github.com/myorg/myapp"   # ← your app repo
    - name: app-repo-revision
      value: main
    - name: overlay-path
      value: "k8s/overlays/loadtest"            # ← path to K8s manifests
    - name: namespace
      value: "loadtest"
    - name: app-service-name
      value: "myapp-service"                    # ← K8s Service name in the overlay
    - name: app-service-port
      value: "8080"

    # ── Downstream service ────────────────────────────────────────────────────
    # The real external/internal service your app calls (payment API, user
    # service, validation API, etc.).
    # WireMock proxies here during recording, replays stubs during load test.
    #
    # Your app overlay MUST route outbound calls to WireMock instead:
    #   env:
    #     - name: DOWNSTREAM_SERVICE_URL
    #       value: "http://wiremock.loadtest.svc.cluster.local:8080"
    - name: downstream-base-url
      value: "https://api.downstream-service.example.com"   # ← real downstream

    # ── Playwright ────────────────────────────────────────────────────────────
    - name: test-filter
      value: ""                                 # e.g. "GwtJourneyTest"

    # ── Gatling load profile ──────────────────────────────────────────────────
    - name: gatling-users
      value: "10"
    - name: gatling-duration
      value: "60"

  workspaces:
    - name: shared-data
      persistentVolumeClaim:
        claimName: playwright-gatling-ws
