apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: wiremock-record-and-load-test-
  labels:
    app: playwright-gatling
spec:
  pipelineRef:
    name: wiremock-record-and-load-test
  taskRunTemplate:
    serviceAccountName: playwright-gatling-sa   # see tekton/rbac.yaml
  params:
    # ── This repo (load test code + Playwright tests) ─────────────────────────
    - name: loadtest-repo-url
      value: "https://github.com/myorg/playwright-gatling"   # ← this repo
    - name: loadtest-repo-revision
      value: main

    # ── Application under test ────────────────────────────────────────────────
    # The app runs normally. WireMock sits in front of it during recording
    # (Playwright → WireMock → app) and replays stubs during load test
    # (Gatling → WireMock). No special overlay config needed.
    - name: app-repo-url
      value: "https://github.com/myorg/myapp"   # ← your app repo
    - name: app-repo-revision
      value: main
    - name: overlay-path
      value: "k8s/overlays/loadtest"            # ← path to k8s manifests
    - name: namespace
      value: "loadtest"
    - name: app-service-name
      value: "myapp-service"                    # ← Service name in the overlay
    - name: app-service-port
      value: "8080"

    # ── Playwright filter (optional) ──────────────────────────────────────────
    - name: test-filter
      value: ""                                 # e.g. "GwtJourneyTest"

    # ── Generated simulation class name ──────────────────────────────────────
    - name: simulation-class-name
      value: "RecordedSimulation"

    # ── Gatling load profile ──────────────────────────────────────────────────
    - name: gatling-users
      value: "10"
    - name: gatling-duration
      value: "60"

  workspaces:
    - name: shared-data
      persistentVolumeClaim:
        claimName: playwright-gatling-ws
