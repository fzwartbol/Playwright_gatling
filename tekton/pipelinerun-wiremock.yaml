apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: wiremock-record-and-load-test-
  labels:
    app: playwright-gatling
spec:
  pipelineRef:
    name: wiremock-record-and-load-test
  taskRunTemplate:
    serviceAccountName: playwright-gatling-sa   # see tekton/rbac.yaml
  params:
    # ── App repo & overlay ──────────────────────────────────────────────────
    - name: app-repo-url
      value: "https://github.com/myorg/myapp"   # ← your app repo
    - name: app-repo-revision
      value: main
    - name: overlay-path
      value: "k8s/overlays/loadtest"             # ← path to your k8s manifests
    - name: namespace
      value: "loadtest"
    - name: app-service-name
      value: "myapp-service"                     # ← Service name in the overlay
    - name: app-service-port
      value: "8080"

    # ── Playwright filter (optional) ────────────────────────────────────────
    - name: test-filter
      value: ""                                  # e.g. "GwtJourneyTest" to run one class

    # ── Gatling load profile ────────────────────────────────────────────────
    - name: gatling-users
      value: "10"
    - name: gatling-duration
      value: "60"
    - name: simulation-class
      value: "simulations.GwtJourneySimulation"

  workspaces:
    - name: shared-data
      persistentVolumeClaim:
        claimName: playwright-gatling-ws
